name: Curation hebdo
on:
  schedule:
    - cron: "0 5 * * 1"   # lundi 7h heure de Paris (été)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python curator.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Sauvegarde de l'état
        run: |
          git config user.name "curateur-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json report.md
          git commit -m "Curation $(date +%F)" || echo "Rien à commiter"
          git push
