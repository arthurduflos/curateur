# ─── Curateur de podcasts / YouTube ───────────────────────────────
playlist_prefix: "Curation" # playlists créées automatiquement : "Curation — Octobre 2026", etc.
playlist_privacy: "private" # private, unlisted ou public
lookback_days: 8 # fenêtre de recherche (8 jours pour un lancement hebdo)
min_duration_min: 10 # exclut shorts et vidéos trop courtes
score_threshold: 7 # note /10 minimale pour entrer dans la playlist
model: "claude-sonnet-5-5" # ou "claude-haiku-4-5-20251001" pour moins cher

# Émissions de confiance : toutes leurs nouvelles vidéos sont évaluées.
# Handles à vérifier sur la page de chaque chaîne (le @ visible sous le nom).
